<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <!-- ТВОРЕЦ: a beam of yellow light rising from below, and the palette in a dark disc with a thin yellow edge -->
  <defs>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F5CD43" stop-opacity="0.9" />
      <stop offset="0.5" stop-color="#F5CD43" stop-opacity="0.28" />
      <stop offset="1" stop-color="#F5CD43" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFF1B8" stop-opacity="0.95" />
      <stop offset="0.6" stop-color="#F5CD43" stop-opacity="0.3" />
      <stop offset="1" stop-color="#F5CD43" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5CD43" stop-opacity="0.85" />
      <stop offset="1" stop-color="#F5CD43" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>
  <rect width="400" height="250" fill="#14161b" />
  <!-- the wide beam and the bright core of it -->
  <polygon points="150,250 250,250 340,0 60,0" fill="url(#beam)" />
  <polygon points="178,250 222,250 238,10 162,10" fill="url(#core)" filter="url(#soft)" />
  <!-- the glow on the floor where it comes from -->
  <ellipse cx="200" cy="256" rx="150" ry="36" fill="url(#floor)" />
  <!-- the disc and the palette (the icon of the tool, 24 x 24 scaled to 53) -->
  <circle cx="200" cy="125" r="46" fill="#0d0f13" stroke="#F5CD43" stroke-width="1.5" />
  <g transform="translate(173.6 98.6) scale(2.2)" fill="none" stroke="#F5CD43" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z" />
    <circle cx="13.5" cy="6.5" r=".5" fill="#F5CD43" />
    <circle cx="17.5" cy="10.5" r=".5" fill="#F5CD43" />
    <circle cx="6.5" cy="12.5" r=".5" fill="#F5CD43" />
    <circle cx="8.5" cy="7.5" r=".5" fill="#F5CD43" />
  </g>
</svg>
