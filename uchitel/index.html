<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E2026" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e2026'/%3E%3Cpath d='M8 13V8h5M19 8h5v5M24 19v5h-5M13 24H8v-5' fill='none' stroke='%23f5cd43' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Ракурс</title>
    <style>
      /* Only until the app starts (it replaces #boot): a dark page with a plain word, so a slow or a failed start is never a blank screen. The colours are those of tokens.css. */
      html,
      body {
        margin: 0;
        background: #1e2026;
        color: #f5f2ec;
      }
      #boot {
        max-width: 36rem;
        margin: 0;
        padding: 32px 20px;
        font: 17px/1.5 system-ui, sans-serif;
      }
      #boot button {
        margin-top: 16px;
        min-height: 48px;
        padding: 0 20px;
        border: 2px solid #b6bbc4;
        border-radius: 10px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CPcM_ikU.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index--ZRLIXQP.css">
  </head>
  <body>
    <div id="root"><p id="boot" role="status">Ракурс се зарежда…</p></div>
    <noscript>Ракурс иска включен JavaScript в браузъра.</noscript>
    <script>
      // If the app has not started in 12 seconds, say what to do instead of leaving the wait without an end.
      setTimeout(function () {
        var boot = document.getElementById('boot');
        if (!boot) return;
        boot.textContent = 'Зареждането се бави или не успя. Опресни страницата (Ctrl+F5). Ако не помогне, провери връзката с интернет.';
        var again = document.createElement('button');
        again.type = 'button';
        again.textContent = 'Опитай пак';
        again.onclick = function () {
          location.reload();
        };
        boot.appendChild(document.createElement('br'));
        boot.appendChild(again);
      }, 12000);
    </script>
  </body>
</html>
